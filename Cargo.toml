[package]
name = "nattes"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
description.workspace = true
categories.workspace = true
keywords.workspace = true
exclude = [".github/", ".gitignore", "benches/", "doc/", "CLAUDE.md", "TODO.md", "flake.nix", "flake.lock"]

[workspace]
members = ["macros"]
resolver = "3"

[workspace.package]
version = "0.3.1"
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/jakumule/nattes"
description = "A simple message queue inspired by NATS"
categories = ["asynchronous"]
keywords = ["message-queue", "nats"]


[dependencies]
nattes-macros = { path = "macros", version = "0.3.1" }

futures-core = { version = "0.3", default-features = false, features = ["std"] }
futures-sink = { version = "0.3", default-features = false, optional = true }
futures-channel = { version = "0.3", default-features = false, features = ["std"] }
futures-util = { version = "0.3", default-features = false }
bytes = { version = "1", optional = true }
arc-swap = "1"
smallvec = "1"
tracing = { version = "0.1", default-features = false, features = ["std"], optional = true }

[features]
# Log subscriptions, publishes and lost messages with `tracing`
tracing = ["dep:tracing"]
# Bridges: extend a bus over a byte transport (`Bridge`, `Codec`, `Wire`)
bridge = ["dep:bytes", "dep:futures-sink", "futures-util/sink", "nattes-macros/bridge"]

[dev-dependencies]
futures = "0.3"
tokio = { version = "1.42.0", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-util = { version = "0.7", features = ["codec"] }
anyhow = "1.0.94"
uuid = { version = "1.11.0", features = ["v7"] }
criterion = { version = "0.8.2", features = ["async_tokio"] }
gungraun = "0.20.0"

[[test]]
name = "bridge"
required-features = ["bridge"]

[package.metadata.docs.rs]
all-features = true

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "instructions"
harness = false
