[package]
name = "nattes"
version = "0.2.0"
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/jakumule/nattes"
description = "A simple message queue inspired by NATS"
categories = ["asynchronous"]
keywords = ["message-queue", "nats"]

[workspace]
members = ["macros"]

[dependencies]

tokio = { version = "1", features = ["sync", "time"] }
futures = "0.3"
arc-swap = "1"
smallvec = "1"
thiserror = "2"
imbl = "7.0.2"
nattes-macros = { path = "macros", version = "0.1.0" }
tracing = { version = "0.1", default-features = false, features = ["std"], optional = true }

[features]
# Log subscriptions, publishes and lost messages with `tracing`
tracing = ["dep:tracing"]

[dev-dependencies]
tokio = { version = "1.42.0", features = ["rt-multi-thread", "macros"] }
anyhow = "1.0.94"
uuid = { version = "1.11.0", features = ["v7"] }
criterion = { version = "0.8.2", features = ["async_tokio"] }
gungraun = "0.20.0"

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "instructions"
harness = false
