<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img" aria-labelledby="title desc">
  <title id="title">A message published on user.id.42.delete and the subscriptions it reaches</title>
  <desc id="desc">The topic tree has git with push, and user with id, a u32 parameter, with update and delete. A message published on user.id.42.delete reaches the subscriptions on everything, on user.id.*.delete and on user.id.42 and below. It doesn't reach the subscriptions on user.id.7 and below, nor on git and below.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; fill: #1f2328; }
    .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; font-size: 12px; fill: #59636e; }
    .node { fill: none; stroke: #8c959f; stroke-width: 1.2; }
    .edge { fill: none; stroke: #8c959f; stroke-width: 1.2; }
    .on { stroke: #0969da; stroke-width: 2; }
    .on-text { fill: #0969da; font-weight: 600; }
    .yes { fill: none; stroke: #1a7f37; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .no { fill: none; stroke: #8c959f; stroke-width: 2; stroke-linecap: round; }
    .dim { fill: #59636e; }
    .rule { stroke: #d1d9e0; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f0f6fc; }
      .label, .dim { fill: #9198a1; }
      .node, .edge, .no { stroke: #656c76; }
      .on { stroke: #4493f8; }
      .on-text { fill: #4493f8; }
      .yes { stroke: #3fb950; }
      .rule { stroke: #3d444d; }
    }
  </style>

  <!-- the tree -->
  <text class="label" x="20" y="24">the tree declared with topics!</text>

  <path class="edge" d="M200 71 V88 H100 V105"/>
  <path class="edge" d="M100 135 V169"/>
  <path class="edge" d="M300 199 V216 H230 V233"/>
  <path class="edge on" d="M200 71 V88 H300 V105"/>
  <path class="edge on" d="M300 135 V169"/>
  <path class="edge on" d="M300 199 V216 H370 V233"/>

  <rect class="node on" x="150" y="41" width="100" height="30" rx="6"/>
  <text class="on-text" x="200" y="60" text-anchor="middle">topics</text>

  <rect class="node" x="50" y="105" width="100" height="30" rx="6"/>
  <text x="100" y="124" text-anchor="middle">git</text>
  <rect class="node on" x="250" y="105" width="100" height="30" rx="6"/>
  <text class="on-text" x="300" y="124" text-anchor="middle">user</text>

  <rect class="node" x="50" y="169" width="100" height="30" rx="6"/>
  <text x="100" y="188" text-anchor="middle">push</text>
  <rect class="node on" x="250" y="169" width="100" height="30" rx="6"/>
  <text class="on-text" x="300" y="188" text-anchor="middle">id(u32)</text>

  <rect class="node" x="180" y="233" width="100" height="30" rx="6"/>
  <text x="230" y="252" text-anchor="middle">update</text>
  <rect class="node on" x="320" y="233" width="100" height="30" rx="6"/>
  <text class="on-text" x="370" y="252" text-anchor="middle">delete</text>

  <text class="label" x="20" y="296">published:</text>
  <text class="on-text" x="20" y="316">bus.user().id(42).delete().publish(msg)</text>

  <line class="rule" x1="450" y1="14" x2="450" y2="316"/>

  <!-- the subscriptions -->
  <text class="label" x="480" y="24">subscriptions, and whether they get it</text>

  <path class="yes" d="M482 59 l5 5 l9 -11"/>
  <text x="510" y="62">bus.subscribe()</text>
  <text class="dim" x="510" y="80">&gt;</text>

  <path class="yes" d="M482 111 l5 5 l9 -11"/>
  <text x="510" y="114">bus.user().id(Wild).delete().subscribe()</text>
  <text class="dim" x="510" y="132">user.id.*.delete</text>

  <path class="yes" d="M482 163 l5 5 l9 -11"/>
  <text x="510" y="166">bus.user().id(42).subscribe()</text>
  <text class="dim" x="510" y="184">user.id.42.&gt;</text>

  <path class="no" d="M483 211 l11 11 M494 211 l-11 11"/>
  <text x="510" y="218">bus.user().id(7).subscribe()</text>
  <text class="dim" x="510" y="236">user.id.7.&gt;</text>

  <path class="no" d="M483 263 l11 11 M494 263 l-11 11"/>
  <text x="510" y="270">bus.git().subscribe()</text>
  <text class="dim" x="510" y="288">git.&gt;</text>
</svg>
